name: Frontier data collector

on:
  # Monday, Wednesday and Friday at 03:00 UTC (08:00 Pakistan time)
  schedule:
    - cron: "0 3 * * 1,3,5"
  # The "Run workflow" button on the Actions page
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = test only | full = one-time history (min 400 MB) | incremental = changes only (min 1 MB)"
        type: choice
        options:
          - smoke
          - incremental
          - full
        default: smoke

permissions:
  contents: read

concurrency:
  group: frontier-collect
  cancel-in-progress: false

env:
  # Scheduled runs have no button input, so they always do an incremental load
  MODE: ${{ github.event.inputs.mode || 'incremental' }}
  # Where the files go in Databricks (change "workspace" if your catalog has another name)
  VOLUME: dbfs:/Volumes/workspace/landing/staging/frontier

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v0.299.0

      - name: Check the Databricks connection
        run: databricks fs ls "$VOLUME"

      - name: Full load safety check (only allowed once)
        if: env.MODE == 'full'
        run: |
          if databricks fs ls "$VOLUME/_state/state.json" > /dev/null 2>&1; then
            echo "A full load was already done (state.json exists). Stopping so data is not loaded twice."
            exit 1
          fi

      - name: Download the last state
        if: env.MODE == 'incremental'
        run: |
          mkdir -p state
          databricks fs cp "$VOLUME/_state/state.json" state/state.json

      - name: Collect data (smoke / full / incremental)
        run: |
          rc=0
          python ingestion/frontier_collect.py --mode "$MODE" --out-dir output --state-in state/state.json || rc=$?
          if [ "$rc" = "2" ]; then
            # Volume rule not met (for example < 1 MB of changes on a quiet day): the collector already logged
            # the refusal and did not move the state. Not an error for a scheduled run; changes keep accumulating.
            echo "::warning::Batch refused by the volume rule. Nothing uploaded; the next run will include these changes."
            rm -rf output/upload
            exit 0
          fi
          exit "$rc"

            - name: Upload data, manifest and state to Databricks
        if: success() && env.MODE != 'smoke'
        run: |
          if [ ! -d output/upload ]; then
            echo "No new data this time. Nothing to upload."
            exit 0
          fi
          cd output/upload
          mapfile -t data_files < <(find new -type f ! -path 'new/_manifests/*' | sort)
          for f in "${data_files[@]}"; do
            databricks fs mkdir "$VOLUME/$(dirname "$f")"
            databricks fs cp "$f" "$VOLUME/$f" --overwrite
          done
          # The manifest is the "batch is complete" marker, so it goes up after all data files
          mapfile -t manifests < <(find new/_manifests -type f | sort)
          for f in "${manifests[@]}"; do
            databricks fs mkdir "$VOLUME/$(dirname "$f")"
            databricks fs cp "$f" "$VOLUME/$f" --overwrite
          done
          # The state is saved LAST, only after everything above worked
          databricks fs mkdir "$VOLUME/_state"
          databricks fs cp _state/state.json "$VOLUME/_state/state.json" --overwrite
          
      - name: Send the error log and run summary to Databricks (always)
        if: always()
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in output/logs/*; do
            databricks fs cp "$f" "$VOLUME/logs/pending/$(basename "$f")" --overwrite
          done

      - name: Keep the logs for 30 days (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-${{ env.MODE }}-logs
          path: output/logs/
          retention-days: 30
          if-no-files-found: ignore
